# Background color of the entire terminal.
background: "#000000"

# Animated falling rain.
rain:
  # Stop raindrops when they reach a box.
  collision: true

  # Number of raindrops spawned in the terminal.
  # Higher values create denser rain and higher CPU usage.
  # Set to 0 to disable rain.
  intensity: 200

  # Characters used for each raindrop.
  character:
    - "│"
    # - "|"
    # - "."
    # - "*"
  # Rain colors with their relative probabilities.
  # Format: [probability, color]
  # Probabilities must add up to 1.0.
  colors:
    - [0.50, "#FFFFFF"]
    - [0.50, "#8747FF"]

  # Rain speeds with their relative probabilities.
  # Value is the delay in milliseconds between movement steps.
  # Lower values produce faster rain.
  # Format: [probability, delay_ms]
  speeds:
    - [0.20, 21]
    - [0.20, 31]
    - [0.20, 41]
    - [0.20, 51]
    - [0.20, 61]

  # Raindrop lengths with their relative probabilities.
  # Format: [probability, length_in_characters]
  lengths:
    - [0.70, 5]
    - [0.25, 15]
    - [0.05, 25]


# Default settings shared by all boxes.
boxes:
  # Border style.
  # Available: single, double, none.
  border: single

  # Border color.
  border_color: "#FFFFFF"

  # Default text color.
  text_color: "#FFFFFF"

  # Default accent color for titles and highlights.
  accent_color: "#8747FF"

  # Space between the border and box content.
  padding:
    # Left and right padding.
    horizontal: 2

    # Top and bottom padding.
    vertical: 0

  # Boxes displayed by Dripfetch.
  items:

    # ─────────────────────────────────────────
    # LOGO
    # ─────────────────────────────────────────

    - type: logo

      # Logo to display.
      # If omitted, the logo is detected from the operating system.
      # Uncomment to force a specific logo.
      # logo: arch

      # Colors available to the logo.
      # Logo files reference these as $1, $2, $3, etc.
      colors:
        - "#8747FF"
        - "#FFFFFF"
        - "#687FE5"
        - "#FFFFFF"
        - "#8747FF"

      # Position relative to the terminal center.
      # Positive values move right/down; negative values move left/up.
      position:
        horizontal: -35
        vertical: -11


    # ─────────────────────────────────────────
    # TEXT
    # ─────────────────────────────────────────

    - type: text

      # Text displayed inside the box.
      text: "Introducing Dripfetch"

      # Colors used by the text box.
      # text  = content
      # title = titles
      # line  = tree and connector characters
      colors:
        text: "#FFFFFF"
        title: "#8747FF"
        line: "#8747FF"

      # Position relative to the terminal center.
      # Positive values move right/down; negative values move left/up.
      position:
        horizontal: -22
        vertical: 3


    # ─────────────────────────────────────────
    # SYSTEM INFORMATION
    # ─────────────────────────────────────────

    - type: sysinfo

      # Colors used by the system information box.
      # text  = information and values
      # title = section headings
      # line  = tree and connector characters
      colors:
        text: "#FFFFFF"
        title: "#FF788D"
        line: "#8747FF"

      # Sections displayed by the system information box.
      # Set a section to false to hide it.
      # Available: system, display, hardware, disk, connectivity.
      sections:
        system: true
        display: true
        hardware: true
        disk: true
        connectivity: true

      # Position relative to the terminal center.
      # Positive values move right/down; negative values move left/up.
      position:
        horizontal: 23
        vertical: 5


    # ─────────────────────────────────────────
    # CLOCK
    # ─────────────────────────────────────────

    - type: clock

      # Position relative to the terminal center.
      # Positive values move right/down; negative values move left/up.
      position:
        horizontal: 19
        vertical: -16

      # Border style.
      # Available: single, double.
      clock_style: double

      # Display size.
      # Available: medium, big.
      clock_size: medium

      # Use 24-hour time.
      clock_24h: true

      # Display seconds.
      show_seconds: false

      # Display AM/PM in 12-hour mode.
      show_am_pm: false

      # Animate the colon between hours and minutes.
      blink_colon: true

      # Display the current date.
      show_date: true


    # ─────────────────────────────────────────
    # WEATHER
    # ─────────────────────────────────────────

    # Weather is disabled by default.
    # Remove the comments below to enable it.

    - type: weather

      # Location used for the weather forecast.
      # Example: Tehran
      location: Tehran

      # Temperature and speed units.
      # Available: metric, imperial.
      # metric   = Celsius / km/h
      # imperial = Fahrenheit / mph
      units: metric

      # Position relative to the terminal center.
      # Positive values move right/down; negative values move left/up.
      position:
        horizontal: -35
        vertical: 12
