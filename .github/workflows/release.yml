name: Build and publish

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-check package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag_version = os.environ["GITHUB_REF_NAME"][1:]
          if tag_version != version:
              raise SystemExit(f"tag v{tag_version} does not match project version {version}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke-check the built wheel
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install dist/*.whl
          .smoke-venv/bin/dripfetch --version
          .smoke-venv/bin/dripfetch --list-configs
          .smoke-venv/bin/dripfetch --list-logos
          .smoke-venv/bin/dripfetch --list-boxes

      - name: Save distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/dripfetch

    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  update_homebrew:
    name: Update Homebrew formula
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Calculate release archive checksum
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          url="https://github.com/a-shygun/dripfetch/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/dripfetch.tar.gz"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/dripfetch.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Update formula version and source checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_URL: ${{ steps.release.outputs.url }}
          SOURCE_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          formula = Path("Formula/dripfetch.rb")
          text = formula.read_text()
          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          source_url = os.environ["SOURCE_URL"]
          source_sha256 = os.environ["SOURCE_SHA256"]

          text, url_count = re.subn(
              r'(?m)^  url "https://github\.com/a-shygun/dripfetch/archive/refs/tags/v[^"]+\.tar\.gz"$',
              f'  url "{source_url}"',
              text,
              count=1,
          )
          if url_count != 1:
              raise SystemExit("Could not find the Dripfetch source URL in Formula/dripfetch.rb")

          text, checksum_count = re.subn(
              r'(?m)^  sha256 "[0-9a-f]{64}"$',
              f'  sha256 "{source_sha256}"',
              text,
              count=1,
          )
          if checksum_count != 1:
              raise SystemExit("Could not find the Dripfetch source checksum in Formula/dripfetch.rb")

          formula.write_text(text)
          print(f"Updated Homebrew formula to Dripfetch {version}")
          PY

      - name: Commit formula update
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- Formula/dripfetch.rb; then
            echo "Formula already matches ${RELEASE_TAG}; no update needed."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dripfetch.rb
          git commit -m "Update Homebrew formula to ${RELEASE_TAG#v}"
          git push origin HEAD:main
