name: Build and publish

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-check package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag_version = os.environ["GITHUB_REF_NAME"][1:]
          if tag_version != version:
              raise SystemExit(f"tag v{tag_version} does not match project version {version}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke-check the built wheel
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install dist/*.whl
          .smoke-venv/bin/dripfetch --version
          .smoke-venv/bin/dripfetch --list-configs
          .smoke-venv/bin/dripfetch --list-logos
          .smoke-venv/bin/dripfetch --list-boxes

      - name: Save distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  release_packages:
    name: Build ${{ matrix.platform }} release downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux_amd64
            deb_arch: amd64
          - os: ubuntu-22.04-arm
            platform: linux_arm64
            deb_arch: arm64
          - os: macos-15-intel
            platform: macos_x86_64
          - os: macos-15
            platform: macos_arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build standalone command
        run: |
          python -m pip install --upgrade pyinstaller
          python -m pip install .
          pyinstaller --clean --noconfirm --onefile \
            --name dripfetch \
            --collect-all dripfetch \
            --collect-all ruamel.yaml \
            --collect-all psutil \
            --copy-metadata dripfetch \
            packaging/entrypoint.py

      - name: Package macOS and Linux command archives
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -czf "dist/dripfetch_${version}_${PLATFORM}.tar.gz" -C dist dripfetch

      - name: Package Debian installer
        if: runner.os == 'Linux'
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_root="$(mktemp -d)"
          install -D dist/dripfetch "$package_root/usr/bin/dripfetch"
          install -d "$package_root/DEBIAN"
          cat > "$package_root/DEBIAN/control" <<EOF
          Package: dripfetch
          Version: ${version}
          Section: utils
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: Dripfetch maintainers <a-shygun@users.noreply.github.com>
          Depends: libc6, libncursesw6
          Description: Customizable terminal system information dashboard with animated rain
           Dripfetch displays system information, clocks, calendars, weather, text, and network graphs in a terminal.
          EOF
          dpkg-deb --root-owner-group --build \
            "$package_root" "dist/dripfetch_${version}_${PLATFORM}.deb"

      - name: Upload platform downloads
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/dripfetch_*
          if-no-files-found: error

  create_github_release:
    name: Create or update GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, release_packages]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: release-assets/

      - name: Download platform downloads
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets/
          merge-multiple: true

      - name: Generate checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          assets = sorted(path for path in Path("release-assets").iterdir() if path.is_file())
          lines = []
          for asset in assets:
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()
              lines.append(f"{digest}  {asset.name}")
          (Path("release-assets") / "dripfetch_checksums.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Create release if needed and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Dripfetch ${GITHUB_REF_NAME#v}"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/dripfetch

    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  update_package_managers:
    name: Update Homebrew and Arch package definitions
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Calculate release archive checksum
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          url="https://github.com/a-shygun/dripfetch/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/dripfetch.tar.gz"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/dripfetch.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Update package versions and source checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_URL: ${{ steps.release.outputs.url }}
          SOURCE_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          formula = Path("Formula/dripfetch.rb")
          text = formula.read_text()
          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          source_url = os.environ["SOURCE_URL"]
          source_sha256 = os.environ["SOURCE_SHA256"]

          text, url_count = re.subn(
              r'(?m)^  url "https://github\.com/a-shygun/dripfetch/archive/refs/tags/v[^"]+\.tar\.gz"$',
              f'  url "{source_url}"',
              text,
              count=1,
          )
          if url_count != 1:
              raise SystemExit("Could not find the Dripfetch source URL in Formula/dripfetch.rb")

          text, checksum_count = re.subn(
              r'(?m)^  sha256 "[0-9a-f]{64}"$',
              f'  sha256 "{source_sha256}"',
              text,
              count=1,
          )
          if checksum_count != 1:
              raise SystemExit("Could not find the Dripfetch source checksum in Formula/dripfetch.rb")

          formula.write_text(text)

          pkgbuild = Path("packaging/arch/PKGBUILD")
          text = pkgbuild.read_text()
          text, version_count = re.subn(
              r"(?m)^pkgver=[^\n]+$",
              f"pkgver={version}",
              text,
              count=1,
          )
          if version_count != 1:
              raise SystemExit("Could not find pkgver in packaging/arch/PKGBUILD")
          text, checksum_count = re.subn(
              r"(?m)^sha256sums=\('[0-9a-f]{64}'\)$",
              f"sha256sums=('{source_sha256}')",
              text,
              count=1,
          )
          if checksum_count != 1:
              raise SystemExit("Could not find sha256sums in packaging/arch/PKGBUILD")
          pkgbuild.write_text(text)

          srcinfo = Path("packaging/arch/.SRCINFO")
          text = srcinfo.read_text()
          text, version_count = re.subn(
              r"(?m)^\tpkgver = [^\n]+$",
              f"\tpkgver = {version}",
              text,
              count=1,
          )
          if version_count != 1:
              raise SystemExit("Could not find pkgver in packaging/arch/.SRCINFO")
          text, source_count = re.subn(
              r"(?m)^\tsource = dripfetch-[^\n]+$",
              f"\tsource = dripfetch-{version}.tar.gz::https://github.com/a-shygun/dripfetch/archive/refs/tags/v{version}.tar.gz",
              text,
              count=1,
          )
          if source_count != 1:
              raise SystemExit("Could not find source in packaging/arch/.SRCINFO")
          text, checksum_count = re.subn(
              r"(?m)^\tsha256sums = [0-9a-f]{64}$",
              f"\tsha256sums = {source_sha256}",
              text,
              count=1,
          )
          if checksum_count != 1:
              raise SystemExit("Could not find sha256sums in packaging/arch/.SRCINFO")
          srcinfo.write_text(text)
          print(f"Updated Homebrew and Arch metadata to Dripfetch {version}")
          PY

      - name: Commit package definition updates
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- Formula/dripfetch.rb packaging/arch/PKGBUILD packaging/arch/.SRCINFO; then
            echo "Package definitions already match ${RELEASE_TAG}; no update needed."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dripfetch.rb packaging/arch/PKGBUILD packaging/arch/.SRCINFO
          git commit -m "Update package definitions to ${RELEASE_TAG#v}"
          git push origin HEAD:main

      - name: Configure AUR SSH key
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan aur.archlinux.org >> "$HOME/.ssh/known_hosts"

      - name: Publish package files to AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git clone ssh://aur@aur.archlinux.org/dripfetch.git "$RUNNER_TEMP/aur-dripfetch"
          cp packaging/arch/PKGBUILD packaging/arch/.SRCINFO "$RUNNER_TEMP/aur-dripfetch/"
          cd "$RUNNER_TEMP/aur-dripfetch"
          if git diff --quiet -- PKGBUILD .SRCINFO; then
            echo "AUR package files already match ${RELEASE_TAG}; no update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${RELEASE_TAG#v}"
          git push origin HEAD

      - name: Explain skipped AUR publishing
        if: env.AUR_SSH_PRIVATE_KEY == ''
        run: echo "AUR files were updated in the source repository. Add the AUR_SSH_PRIVATE_KEY repository secret to publish them to the AUR automatically."
