[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dripfetch"
version = "0.4.0"
description = "A customizable terminal system information display with animated rain."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Amir Shygun" },
]
keywords = ["terminal", "system information", "fetch", "curses", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System",
    "Topic :: Terminals",
]

dependencies = [
    "psutil",
    "ruamel.yaml",
]

[project.urls]
Homepage = "https://github.com/a-shygun/dripfetch"
Repository = "https://github.com/a-shygun/dripfetch"
Issues = "https://github.com/a-shygun/dripfetch/issues"
Security = "https://github.com/a-shygun/dripfetch/security"

[project.scripts]
dripfetch = "dripfetch.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dripfetch = [
    "assets/logos/*.txt",
    "assets/configs/*.yaml",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"